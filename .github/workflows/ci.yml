name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    outputs:
      parity-artifact-id: ${{ steps.parity-upload.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test website
        run: npm run test:e2e

      - name: Set up PHP for TestParity
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, simplexml
          coverage: none

      - name: Install TestParity
        run: |
          composer global require testparity/parity:1.4.1 --prefer-dist --no-progress --no-interaction
          composer global config bin-dir --absolute >> "$GITHUB_PATH"

      - name: Check homepage showcase coverage
        run: |
          parity test --no-check
          test -s .parity/per-test/index.json
          report_status=0
          parity check --format=github > .parity/comment.md || report_status=$?
          parity check --format=json > .parity/result.json
          exit "$report_status"

      - name: Upload TestParity reports
        id: parity-upload
        if: ${{ !cancelled() && hashFiles('.parity/comment.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: testparity-website-coverage
          path: |
            .parity/comment.md
            .parity/result.json
            .parity/per-test/
          include-hidden-files: true
          retention-days: 14

  parity-comment:
    name: Publish TestParity PR comment
    needs: ci
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.ci.outputs.parity-artifact-id != '' }}
    permissions:
      pull-requests: write
    uses: testparity/cli/.github/workflows/parity-comment.yml@18489a20181f4d012a93563481e179a6b8b23ecc # v1.4.1
    with:
      artifact-name: testparity-website-coverage
      report-path: comment.md
