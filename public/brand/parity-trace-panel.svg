<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="title desc">
  <title id="title">Parity trace view</title>
  <desc id="desc">A source file connected to its belonging test with matched coverage percentages.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2239"/>
      <stop offset="1" stop-color="#07111e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#287cff"/>
      <stop offset="1" stop-color="#22d3b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#020711" flood-opacity=".48"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="620" height="480" rx="30" fill="url(#panel)" stroke="#29445c" filter="url(#shadow)"/>
  <path d="M40 88H600M40 126H600M40 164H600M40 202H600M40 240H600M40 278H600M40 316H600M40 354H600M40 392H600M40 430H600" stroke="#24405a" stroke-opacity=".35"/>
  <path d="M178 40V460M338 40V460M502 40V460" stroke="#24405a" stroke-opacity=".28"/>
  <text x="42" y="52" fill="#8aa5bc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">PARITY / TRACE VIEW</text>
  <circle cx="550" cy="47" r="5" fill="#22d3b6"/>
  <text x="566" y="52" fill="#a8c3d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="end">LIVE REPORT</text>

  <text x="42" y="114" fill="#6f8da8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.4">SOURCE FILE</text>
  <text x="204" y="114" fill="#6f8da8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.4">BELONGING TEST</text>
  <text x="472" y="114" fill="#6f8da8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.4">MATCHED</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <rect x="32" y="136" width="576" height="54" rx="12" fill="#112b45" stroke="#315471"/>
    <text x="48" y="169" fill="#e2edf7">InvoiceTotal.php</text>
    <path d="M174 163H204" stroke="url(#accent)" stroke-width="2" stroke-dasharray="3 4"/>
    <circle cx="190" cy="163" r="4" fill="#22d3b6"/>
    <text x="220" y="169" fill="#c3d8e8">InvoiceTotalTest.php</text>
    <text x="478" y="169" fill="#75edca" font-weight="700">91%</text>

    <rect x="32" y="208" width="576" height="54" rx="12" fill="#10263e" stroke="#274863"/>
    <text x="48" y="241" fill="#e2edf7">Slugger.php</text>
    <path d="M174 235H204" stroke="url(#accent)" stroke-width="2" stroke-dasharray="3 4"/>
    <circle cx="190" cy="235" r="4" fill="#22d3b6"/>
    <text x="220" y="241" fill="#c3d8e8">SluggerTest.php</text>
    <text x="478" y="241" fill="#75edca" font-weight="700">100%</text>

    <rect x="32" y="280" width="576" height="54" rx="12" fill="#2b251c" stroke="#836a3c"/>
    <text x="48" y="313" fill="#fff2d7">CheckoutGateway.php</text>
    <path d="M174 307H204" stroke="#efb865" stroke-width="2" stroke-dasharray="3 4"/>
    <circle cx="190" cy="307" r="4" fill="#efb865"/>
    <text x="220" y="313" fill="#f2d6a1">CheckoutGatewayTest.php</text>
    <text x="478" y="313" fill="#efc36f" font-weight="700">18%</text>
  </g>

  <path d="M48 380H592" stroke="#315471"/>
  <text x="48" y="407" fill="#8aa5bc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">MINIMUM MATCHED COVERAGE</text>
  <text x="592" y="407" fill="#e2edf7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="end">70%</text>
  <rect x="48" y="423" width="544" height="7" rx="4" fill="#19334c"/>
  <rect x="48" y="423" width="392" height="7" rx="4" fill="url(#accent)"/>
  <circle cx="440" cy="426.5" r="6" fill="#efb865" stroke="#07111e" stroke-width="3"/>
</svg>
